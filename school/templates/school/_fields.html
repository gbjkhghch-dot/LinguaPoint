
{% if form.non_field_errors %}
    <div class="error" role="alert">
        {{ form.non_field_errors }}
    </div>
{% endif %}

{% for field in form %}
    <div class="field">
        <label for="{{ field.id_for_label }}">
            {{ field.label }}
        </label>

        {{ field }}

        {% if field.help_text %}
            <small>
                {{ field.help_text|safe }}
            </small>
        {% endif %}

        {% for error in field.errors %}
            <small class="error" role="alert">
                {{ error }}
            </small>
        {% endfor %}

        <small
            class="client-error"
            aria-live="polite"
        ></small>
    </div>
{% endfor %}
